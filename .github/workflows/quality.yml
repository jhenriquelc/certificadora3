name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check
